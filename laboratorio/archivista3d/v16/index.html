<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archivista 3D — Test V16</title><style>body{margin:0;background:#151922;color:#f3f5fa;font:16px system-ui}header{padding:14px 18px}h1{font-size:20px;margin:0}p{font-size:13px;color:#b5becb}#view{height:70vh;min-height:350px}nav{display:flex;gap:8px;padding:12px;flex-wrap:wrap}button{padding:12px;border:0;border-radius:8px;background:#334155;color:white}button:focus{outline:2px solid #7dd3fc}</style></head><body><header><h1>Archivista 3D — Test V16</h1><p>Modello sperimentale. Trascina per ruotare, pizzica per ingrandire.</p></header><div id="view"></div><nav><button id="play">Pausa</button><button id="reset">Riavvia</button><button id="rotate">Rotazione automatica: no</button></nav><p style="padding:0 18px" id="status">Caricamento modello…</p><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const el=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color('#202633');const camera=new THREE.PerspectiveCamera(38,1,.01,100);camera.position.set(2.6,-3.6,1.7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,.85);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x555f72,2.4));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,-3,5);scene.add(light);const mixerState={mixer:null,playing:true};new GLTFLoader().load('./archivista_v16.glb',g=>{scene.add(g.scene);mixerState.mixer=new THREE.AnimationMixer(g.scene);if(g.animations.length){mixerState.mixer.clipAction(g.animations[0]).play();document.querySelector('#status').textContent='Animazione caricata: '+g.animations.length+' clip';}else document.querySelector('#status').textContent='Modello caricato, ma nessuna animazione rilevata.';},undefined,e=>document.querySelector('#status').textContent='Errore caricamento GLB: '+e.message);document.querySelector('#play').onclick=()=>{mixerState.playing=!mixerState.playing;document.querySelector('#play').textContent=mixerState.playing?'Pausa':'Riprendi'};document.querySelector('#reset').onclick=()=>{if(mixerState.mixer)mixerState.mixer.setTime(0)};document.querySelector('#rotate').onclick=()=>{controls.autoRotate=!controls.autoRotate;document.querySelector('#rotate').textContent='Rotazione automatica: '+(controls.autoRotate?'sì':'no')};const clock=new THREE.Clock();function size(){let w=el.clientWidth,h=el.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',size);size();function tick(){requestAnimationFrame(tick);if(mixerState.mixer&&mixerState.playing)mixerState.mixer.update(clock.getDelta());else clock.getDelta();controls.update();renderer.render(scene,camera)}tick();</script></body></html>
