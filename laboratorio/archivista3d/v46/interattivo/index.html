<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archivista 3D — V46 interattiva</title><style>body{margin:0;background:#141b26;color:#f8fafc;font:16px system-ui}header{padding:16px}h1{font-size:23px;margin:0}p{color:#cbd5e1;font-size:14px;line-height:1.5}#view{height:75vh;min-height:400px}nav{display:flex;gap:10px;padding:12px;flex-wrap:wrap}button{border:0;border-radius:8px;background:#334155;color:white;padding:12px;font-size:15px}a{color:#93c5fd}</style></head><body><header><h1>Archivista 3D — V46 interattiva</h1><p>Modello GLB esportato direttamente da Blender. Trascina per ruotare, pizzica per ingrandire. Questa è una verifica tecnica, non un avatar realistico approvato.</p></header><div id="view"></div><nav><button id="front">Frontale</button><button id="side">Profilo</button><button id="angle">Tre quarti</button><button id="spin">Rotazione automatica: no</button></nav><p style="padding:0 16px" id="status">Caricamento…</p><p style="padding:0 16px"><a href="../v46/index.html">Confronta i tre render statici</a></p><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{DRACOLoader}from'three/addons/loaders/DRACOLoader.js';const el=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color('#222936');const camera=new THREE.PerspectiveCamera(38,1,.01,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x64748b,2.5));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(2,4,3);scene.add(light);const loader=new GLTFLoader(),draco=new DRACOLoader();draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');loader.setDRACOLoader(draco);let center=new THREE.Vector3(),radius=1;function setView(x,y,z){camera.position.copy(center).add(new THREE.Vector3(x*radius,y*radius,z*radius));camera.lookAt(center);controls.target.copy(center);controls.update()}loader.load('./archivista_v46.glb',g=>{scene.add(g.scene);const bounds=new THREE.Box3().setFromObject(g.scene);center=bounds.getCenter(new THREE.Vector3());radius=Math.max(bounds.getSize(new THREE.Vector3()).length()*.6,.6);setView(0,.12,2.2);document.querySelector('#status').textContent='V46 caricata. Puoi ruotare il modello e controllare gli occhi e i capelli.'},undefined,e=>document.querySelector('#status').textContent='Errore caricamento: '+e.message);document.querySelector('#front').onclick=()=>setView(0,.12,2.2);document.querySelector('#side').onclick=()=>setView(2.2,.12,0);document.querySelector('#angle').onclick=()=>setView(1.3,.12,1.8);document.querySelector('#spin').onclick=()=>{controls.autoRotate=!controls.autoRotate;document.querySelector('#spin').textContent='Rotazione automatica: '+(controls.autoRotate?'sì':'no')};function resize(){const w=el.clientWidth,h=el.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)}tick();</script></body></html>
