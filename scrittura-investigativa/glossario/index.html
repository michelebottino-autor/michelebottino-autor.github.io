e);list.append(card)}if(!list.children.length)list.textContent='Nessun termine trovato.'}document.getElementById('search').addEventListener('input',draw);fetch('../glossario.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d.terms||[];draw()}).catch(()=>{list.textContent='Glossario temporaneamente non disponibile.'})</script></body></html>
