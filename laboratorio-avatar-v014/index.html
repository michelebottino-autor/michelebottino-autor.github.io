<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archivista3D - V014 diagnostica</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>body{margin:0;background:#15202d;color:#f1f5f9;font:16px system-ui}main{max-width:960px;margin:auto;padding:18px}model-viewer{width:100%;height:72vh;min-height:420px;background:#253449;border-radius:16px}button{padding:12px;margin:6px;border:1px solid #9db3c9;background:#324b66;color:white;border-radius:8px}p{line-height:1.5}</style></head><body><main><h1>Archivista3D — V014</h1><p><strong>PROVA DIAGNOSTICA NON APPROVATA.</strong> Nuova calotta anatomica, ancora incompleta nell'attaccatura frontale e laterale. Ruota il modello con un dito, ingrandisci con due dita.</p><model-viewer id="avatar" src="./avatar_V014_CALOTTA_ANATOMICA_DIAGNOSTICO.glb" camera-controls shadow-intensity="1" exposure="1" alt="Archivista3D V014, modello diagnostico non approvato"></model-viewer><p id="status">Caricamento modello...</p><button onclick="document.getElementById('avatar').cameraOrbit='0deg 90deg auto'">Frontale</button><button onclick="document.getElementById('avatar').cameraOrbit='90deg 90deg auto'">Profilo</button><button onclick="document.getElementById('avatar').cameraOrbit='180deg 90deg auto'">Posteriore</button><p>Versione autonoma: nessun modello precedente è stato sovrascritto.</p></main><script>const m=document.getElementById('avatar'),s=document.getElementById('status');m.addEventListener('load',()=>s.textContent='Modello V014 caricato.');m.addEventListener('error',()=>s.textContent='Errore nel caricamento del modello.');</script></body></html>
