name: Restyling editorial smoke test
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - '.github/scripts/test-restyling-navigation.js'
      - '.github/workflows/restyling-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/test-restyling-navigation.js
