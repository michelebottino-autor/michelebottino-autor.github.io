name: HTR public corpus isolated smoke
on:
  push:
    paths:
      - .github/workflows/htr-public-smoke.yml
      - adc/governance/tools/htr-public-smoke.py
  workflow_dispatch:
jobs:
  htr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU Kraken
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kraken==7.1.1' pillow
      - name: Check imports
        run: python -c 'import regex, torch, lightning.pytorch, kraken; print("HTR_IMPORT_OK",torch.__version__)'
      - name: Prepare public manuscript line pairs
        run: python adc/governance/tools/htr-public-smoke.py
      - name: Run one-epoch CPU training smoke test
        run: |
          ketos train -f path -q fixed -N 1 -B 2 -o htr-smoke/model -t htr-smoke/train.txt -e htr-smoke/test.txt 2>&1 | tee htr-smoke/training.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Save execution log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htr-public-smoke-log
          path: htr-smoke/training.log
          if-no-files-found: ignore
