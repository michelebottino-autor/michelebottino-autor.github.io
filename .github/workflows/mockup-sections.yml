name: Mockup section checks
on:
  pull_request:
    paths:
      - 'assets/css/mockup-sezioni-2026.css'
      - 'biografia/index.html'
      - 'opere/index.html'
      - 'adc/index.html'
      - 'ricerca/index.html'
      - 'contatti/index.html'
      - '.github/scripts/test-mockup-sections.js'
      - '.github/scripts/test-mockup-browser.js'
      - '.github/workflows/mockup-sections.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/test-mockup-sections.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mockup-site.log 2>&1 &
      - run: node .github/scripts/test-mockup-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mockup-sezioni-screenshots
          path: restyling-screenshots/sections/
          if-no-files-found: warn
