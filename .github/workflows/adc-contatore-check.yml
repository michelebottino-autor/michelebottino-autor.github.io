name: Verifica contatore ADC
on:
  workflow_dispatch:
  push:
    paths:
      - 'adc/contatore-config.json'
      - 'adc/assets/navigazione-unificata.js'
      - 'tests/adc-navigation-counter.test.cjs'
      - 'adc/assets/visite.js'
      - 'adc/presenza-config.json'
      - 'assets/js/lettori-presenti.js'
      - 'infrastruttura/presenza/**'
      - 'tests/adc-presence.test.mjs'
      - 'adc-contatore/**'
      - '.github/workflows/adc-contatore-check.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica sintassi JavaScript
        run: |
          node --check adc/assets/navigazione-unificata.js
          node --check adc-contatore/src/worker.js
          node --check adc/assets/visite.js
          node --check assets/js/lettori-presenti.js
          node --test tests/adc-navigation-counter.test.cjs tests/adc-presence.test.mjs
      - name: Verifica configurazione e schema
        run: |
          python - <<'PY'
          import json, pathlib
          cfg=json.loads(pathlib.Path('adc/contatore-config.json').read_text())
          endpoint=cfg.get('endpoint','')
          assert endpoint.startswith('https://') and endpoint.endswith('/visite')
          sql=pathlib.Path('adc-contatore/schema.sql').read_text()
          assert f"('adc', {cfg['legacyBase']})" in sql
          print('Contatore ADC: controlli statici superati')
          PY
