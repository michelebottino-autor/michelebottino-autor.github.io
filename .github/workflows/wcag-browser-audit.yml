name: Audit automatico accessibilità WCAG
on:
  pull_request:
    paths:
      - 'index.html'
      - 'adc/index.html'
      - 'adc/custode/**'
      - 'adc/elena/**'
      - 'adc/assets/elena-dialogo.js'
      - 'adc/assets/elena-indice.json'
      - 'adc/assets/elena-risposte-approvate.json'
      - 'adc/percorsi.html'
      - 'adc/storia/**'
      - 'adc/dossier-rationes/**'
      - 'adc/atlante/**'
      - 'adc/inventario/**'
      - 'adc/mediateca/**'
      - 'adc/fonti/**'
      - 'adc/carta/**'
      - 'adc/contribuisci/**'
      - 'adc/inventario/testimonianze.json'
      - 'accessibilita/**'
      - 'privacy/**'
      - 'cookie/**'
      - 'tests/accessibility/**'
      - '.github/workflows/wcag-browser-audit.yml'
  workflow_dispatch:
jobs:
  wcag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installazione strumenti
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Avvio server statico
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/adc-a11y-server.log 2>&1 &
      - name: Audit automatico WCAG
        timeout-minutes: 3
        run: node tests/accessibility/audit.cjs
      - name: Consenso e navigazione
        timeout-minutes: 3
        run: node tests/accessibility/consent-navigation.cjs
      - name: Controllo editoriale e Custode ADC
        timeout-minutes: 3
        run: node tests/accessibility/adc-editorial-custode.cjs
      - name: Controllo risposte documentarie Elena
        timeout-minutes: 2
        run: node tests/accessibility/elena-documentary.cjs
