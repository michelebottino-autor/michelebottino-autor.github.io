name: Controllo editoriale pubblico
on:
  push:
    branches: [main]
  pull_request:
jobs:
  editorial-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica delle note interne nelle pagine pubbliche
        run: |
          node .github/scripts/verify-public-editorial.js --self-test
          node .github/scripts/verify-public-editorial.js
      - name: Verifica censimento ADC e cataloghi
        run: |
          python3 adc/governance/verifica_censimento.py
          python3 adc/governance/verifica_metadati.py
          python3 adc/governance/verifica_elena.py
