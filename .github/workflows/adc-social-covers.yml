name: Generate ADC social covers
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/create_social_covers.py'
      - '.github/workflows/adc-social-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python .github/scripts/create_social_covers.py
      - name: Commit generated PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/adc-social/*.png
          if ! git diff --cached --quiet; then
            git commit -m "ADC: pubblica copertine social PNG per articolo"
            git push
          fi
