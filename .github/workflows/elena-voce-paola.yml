name: Elena - genera campione voce Paola
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/elena-voce-paola.yml'
permissions:
  contents: write
jobs:
  genera-paola:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa codificatore MP3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Installa sintetizzatore Piper
        run: python -m pip install --disable-pip-version-check piper-tts
      - name: Recupera e controlla modello Paola approvato
        run: |
          mkdir -p /tmp/paola
          curl -fLsS --retry 3 -o /tmp/paola/it_IT-paola-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx
          curl -fLsS --retry 3 -o /tmp/paola/it_IT-paola-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/it/it_IT/paola/medium/it_IT-paola-medium.onnx.json
          echo '6fc918b5a0ea6137382833dddfa567bffbe6a5060c02043c87192ee59c04210c  /tmp/paola/it_IT-paola-medium.onnx' | sha256sum -c -
      - name: Genera audio con profilo NarrazioneADC
        run: |
          mkdir -p adc/audio
          printf '%s\n' "Benvenuti nell'Archivio Documentale Calatabiano. Sono Elena e posso accompagnarvi nella consultazione delle fonti storiche." | piper --model /tmp/paola/it_IT-paola-medium.onnx --length_scale 1.20 --noise_scale 0.30 --noise_w 0.45 --output_file /tmp/paola/benvenuto.wav
          ffmpeg -hide_banner -loglevel error -y -i /tmp/paola/benvenuto.wav -codec:a libmp3lame -b:a 96k adc/audio/elena-paola-benvenuto.mp3
          test -s adc/audio/elena-paola-benvenuto.mp3
          python - <<'PY'
          import pathlib, subprocess
          clips = {
            'risposta-indice': 'Fonti e percorsi da consultare. Non è disponibile una risposta sintetica verificata per questa domanda. Questi percorsi potrebbero essere pertinenti: consulta le fonti prima di trarre conclusioni.',
            'risposta-vuota': 'Nessuna fonte sufficiente individuata. Non ho trovato un percorso sufficientemente pertinente nell’indice pubblico. Puoi consultare il repertorio generale oppure riprovare indicando una località, un anno o un argomento.'
          }
          for key, value in clips.items():
              wav = pathlib.Path('/tmp/paola') / (key + '.wav')
              subprocess.run(['piper', '--model', '/tmp/paola/it_IT-paola-medium.onnx', '--length_scale', '1.20', '--noise_scale', '0.30', '--noise_w', '0.45', '--output_file', str(wav)], input=value, text=True, check=True)
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav),'-codec:a','libmp3lame','-b:a','96k','adc/audio/elena-paola-'+key+'.mp3'],check=True)
          PY
      - name: Crea lettura integrale pagina Storia per tutti
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import subprocess, re
          source=Path('adc/storia-per-tutti/index.html').read_text(encoding='utf-8')
          soup=BeautifulSoup(source,'html.parser')
          main=soup.select_one('main')
          if main is None: raise SystemExit('Contenuto principale mancante')
          for tag in main.select('script,style,nav,form,button,aside,footer,[hidden],.elena-presenza'):
              tag.decompose()
          elements=main.select('h1,h2,h3,p,li')
          parts=[e.get_text(' ',strip=True) for e in elements]
          parts=[re.sub(r'\s+',' ',v) for v in parts if v.strip()]
          full=' '.join(parts)
          if len(full)<400:raise SystemExit('Testo insufficiente')
          chunks=[];buf=''
          for sentence in re.split(r'(?<=[.!?])\s+',full):
              if len(buf)+len(sentence)>900 and buf:
                  chunks.append(buf);buf=''
              if len(sentence)>900:
                  while len(sentence)>900:
                      chunks.append(sentence[:900]);sentence=sentence[900:]
              buf=(buf+' '+sentence).strip()
          if buf:chunks.append(buf)
          segments=[]
          for i,chunk in enumerate(chunks):
              wav=Path('/tmp/paola')/f'pagina-{i:03d}.wav'
              mp3=Path('/tmp/paola')/f'pagina-{i:03d}.mp3'
              subprocess.run(['piper','--model','/tmp/paola/it_IT-paola-medium.onnx','--length_scale','1.20','--noise_scale','0.30','--noise_w','0.45','--output_file',str(wav)],input=chunk,text=True,check=True)
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav),'-codec:a','libmp3lame','-b:a','96k',str(mp3)],check=True)
              segments.append(mp3)
          concat=Path('/tmp/paola/concat.txt')
          concat.write_text(''.join("file '"+str(p)+"'\n" for p in segments))
          dest=Path('adc/audio/elena-paola-storia-per-tutti.mp3')
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','concat','-safe','0','-i',str(concat),'-c','copy',str(dest)],check=True)
          print('Testo',len(full),'caratteri,',len(segments),'segmenti, audio',dest.stat().st_size,'byte')
          PY
      - name: Crea lettura della pagina Elena
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import subprocess, re
          source=Path('adc/elena/index.html').read_text(encoding='utf-8')
          soup=BeautifulSoup(source,'html.parser')
          main=soup.select_one('main')
          if main is None: raise SystemExit('Contenuto principale mancante')
          for tag in main.select('script,style,nav,form,button,aside,footer,[hidden],.elena-presenza'):
              tag.decompose()
          elements=main.select('h1,h2,h3,p,li')
          parts=[e.get_text(' ',strip=True) for e in elements]
          parts=[re.sub(r'\s+',' ',v) for v in parts if v.strip()]
          full=' '.join(parts)
          if len(full)<400:raise SystemExit('Testo insufficiente')
          chunks=[];buf=''
          for sentence in re.split(r'(?<=[.!?])\s+',full):
              if len(buf)+len(sentence)>900 and buf:
                  chunks.append(buf);buf=''
              if len(sentence)>900:
                  while len(sentence)>900:
                      chunks.append(sentence[:900]);sentence=sentence[900:]
              buf=(buf+' '+sentence).strip()
          if buf:chunks.append(buf)
          segments=[]
          for i,chunk in enumerate(chunks):
              wav=Path('/tmp/paola')/f'pagina-{i:03d}.wav'
              mp3=Path('/tmp/paola')/f'pagina-{i:03d}.mp3'
              subprocess.run(['piper','--model','/tmp/paola/it_IT-paola-medium.onnx','--length_scale','1.20','--noise_scale','0.30','--noise_w','0.45','--output_file',str(wav)],input=chunk,text=True,check=True)
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav),'-codec:a','libmp3lame','-b:a','96k',str(mp3)],check=True)
              segments.append(mp3)
          concat=Path('/tmp/paola/concat.txt')
          concat.write_text(''.join("file '"+str(p)+"'\n" for p in segments))
          dest=Path('adc/audio/elena-paola-pagina-elena.mp3')
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','concat','-safe','0','-i',str(concat),'-c','copy',str(dest)],check=True)
          print('Testo',len(full),'caratteri,',len(segments),'segmenti, audio',dest.stat().st_size,'byte')
          PY
      - name: Pubblica campione audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adc/audio/elena-paola-*.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Elena: campione audio voce Paola verificata"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
