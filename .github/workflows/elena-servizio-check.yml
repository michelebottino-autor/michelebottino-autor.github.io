name: Elena - verifica servizio documentario
on:
  push:
    paths:
      - 'elena-servizio/**'
      - '.github/scripts/test-elena-servizio.mjs'
      - '.github/workflows/elena-servizio-check.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check --input-type=module < elena-servizio/src/index.js
      - run: node .github/scripts/test-elena-servizio.mjs
