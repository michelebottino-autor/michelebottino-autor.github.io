name: Android APK di prova
on:
  workflow_dispatch:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/android-debug-apk.yml'
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verifica Android SDK del runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Installa dipendenze Capacitor
        run: npm install --no-audit --no-fund
      - name: Genera progetto Android
        run: npx cap add android
      - name: Sincronizza contenuti
        run: npx cap sync android
      - name: Crea APK debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Verifica APK generato
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Conserva APK di prova
        uses: actions/upload-artifact@v4
        with:
          name: michele-bottino-android-debug
          path: app-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
