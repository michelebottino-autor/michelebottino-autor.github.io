name: Elena - regressione documentaria
on:
  push:
    paths:
      - 'adc/assets/elena-dialogo.js'
      - 'adc/assets/elena-presenza.js'
      - 'adc/assets/elena-indice.json'
      - 'adc/assets/elena-risposte-approvate.json'
      - 'adc/assets/elena-risposte.json'
      - '.github/scripts/test-elena-presenza.js'
      - '.github/scripts/test-elena-contesto.js'
      - 'scripts/test_elena_upgrade.cjs'
      - 'scripts/test_elena_search.cjs'
      - 'scripts/test_elena_passages.cjs'
      - '.github/scripts/test-elena-dialogo.js'
      - '.github/workflows/elena-dialogo-check.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check adc/assets/elena-dialogo.js
      - run: node scripts/test_elena_upgrade.cjs
      - run: node scripts/test_elena_search.cjs
      - run: node scripts/test_elena_passages.cjs
      - run: node .github/scripts/test-elena-dialogo.js
      - run: node .github/scripts/test-elena-contesto.js
      - run: node .github/scripts/test-elena-presenza.js
