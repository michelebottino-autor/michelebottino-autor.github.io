name: Elena - regressione documentaria
on:
  push:
    paths:
      - 'adc/assets/elena-dialogo.js'
      - '.github/scripts/test-elena-dialogo.js'
      - '.github/workflows/elena-dialogo-check.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check adc/assets/elena-dialogo.js
      - run: node .github/scripts/test-elena-dialogo.js
