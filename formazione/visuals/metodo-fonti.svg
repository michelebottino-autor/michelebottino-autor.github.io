<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 490" role="img" aria-labelledby="t d"><title id="t">Una conclusione non equivale a una prova</title><desc id="d">Tre livelli distinti per controllare un'affermazione</desc><rect width="1080" height="490" rx="25" fill="#102a40"/><path d="M0 94 H1080" stroke="#3d6375"/><text x="44" y="55" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#fff">Una conclusione non equivale a una prova</text><text x="44" y="80" font-family="Arial,sans-serif" font-size="15" fill="#c6d8e1">Tre livelli distinti per controllare un'affermazione</text><rect x="38" y="155" width="320" height="235" rx="17" fill="#eef4f5"/><rect x="38" y="155" width="320" height="9" rx="4" fill="#2d7a85"/><text x="58" y="207" font-size="22" font-family="Arial,sans-serif" font-weight="bold" fill="#18354c">FATTO OSSERVATO</text><text x="58" y="255" font-size="18" font-family="Arial,sans-serif" fill="#2f4757">Un testo riporta</text><text x="58" y="285" font-size="18" font-family="Arial,sans-serif" fill="#2f4757">una data precisa</text><rect x="378" y="155" width="320" height="235" rx="17" fill="#eef4f5"/><rect x="378" y="155" width="320" height="9" rx="4" fill="#bd873c"/><text x="398" y="207" font-size="22" font-family="Arial,sans-serif" font-weight="bold" fill="#18354c">FONTE</text><text x="398" y="255" font-size="18" font-family="Arial,sans-serif" fill="#2f4757">Chi ha prodotto</text><text x="398" y="285" font-size="18" font-family="Arial,sans-serif" fill="#2f4757">il documento?</text><rect x="718" y="155" width="320" height="235" rx="17" fill="#eef4f5"/><rect x="718" y="155" width="320" height="9" rx="4" fill="#5876aa"/><text x="738" y="207" font-size="22" font-family="Arial,sans-serif" font-weight="bold" fill="#18354c">CONCLUSIONE</text><text x="738" y="255" font-size="18" font-family="Arial,sans-serif" fill="#2f4757">Che cosa possiamo</text><text x="738" y="285" font-size="18" font-family="Arial,sans-serif" fill="#2f4757">sostenere davvero?</text><text x="44" y="439" font-family="Arial,sans-serif" font-size="19" fill="#fff">Esercizio: individua il salto non giustificato tra fonte e conclusione.</text><text x="44" y="466" font-family="Arial,sans-serif" font-size="13" fill="#bfd0d9">© 2026 Michele Bottino · Schema originale · Esempio didattico, non fonte storica</text></svg>