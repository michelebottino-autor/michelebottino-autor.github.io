<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500"><rect width="1080" height="500" rx="22" fill="#143247"/><text x="35" y="44" fill="#cde4eb" font-size="20" font-family="Arial">Archivio e racconto | Unita 6</text><text x="35" y="76" fill="white" font-size="24" font-family="Arial">Dal documento all’affermazione</text><rect x="33" y="133" width="325" height="280" rx="15" fill="#f3f7f7"/><rect x="33" y="133" width="325" height="10" fill="#218489"/><text x="53" y="183" font-family="Arial" font-size="20" font-weight="bold" fill="#163248">OSSERVA</text><text x="53" y="230" fill="#284e65" font-size="19" font-family="Arial">6.1 La matrice delle</text><text x="53" y="260" fill="#284e65" font-size="19" font-family="Arial">affermazioni</text><rect x="378" y="133" width="325" height="280" rx="15" fill="#f3f7f7"/><rect x="378" y="133" width="325" height="10" fill="#b68440"/><text x="398" y="183" font-family="Arial" font-size="20" font-weight="bold" fill="#163248">CONFRONTA</text><text x="398" y="230" fill="#284e65" font-size="19" font-family="Arial">6.2 Citare con precisione</text><rect x="723" y="133" width="325" height="280" rx="15" fill="#f3f7f7"/><rect x="723" y="133" width="325" height="10" fill="#5277a5"/><text x="743" y="183" font-family="Arial" font-size="20" font-weight="bold" fill="#163248">VERIFICA</text><text x="743" y="230" fill="#284e65" font-size="19" font-family="Arial">6.3 Quando due tracce</text><text x="743" y="260" fill="#284e65" font-size="19" font-family="Arial">confliggono</text><text x="35" y="452" font-size="18" font-family="Arial" fill="#fff">Esercizio: individua un dato, un dubbio e una verifica possibile.</text><text x="35" y="482" fill="#bcd2db" font-family="Arial" font-size="14">Schema originale di Michele Bottino - esempio didattico, non fonte storica</text></svg>